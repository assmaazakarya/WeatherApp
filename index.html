<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <!-- & font -->
     <link rel="shortcut icon" href="./assets/images/cloudy.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <!-- ^ styles -->
    <link rel="stylesheet" href="./assets/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    
<section>
  <div class="container py-4">
    <div class="row wrap">
        <div class="col-12 col-lg-4">
            <aside class="bg-white p-4  text-center">
                <form>
                    <i class="fa-solid fa-search "></i>
                    <input type="search" name="" id="" placeholder="search for places ...">
                </form>
                 <img src="" alt="" class="w-75 pt-3 current-img">
                 <h3 class="h1 display-3 temp"></h3>
                 <p class="dayname"></p>
                 <hr>
                 <div class="d-flex flex-column align-items-center">
                        <p class="city"></p>
                        <p class="country"></p>
                 </div>
                 <div class="rounded-4 overflow-hidden h-100px mt-4">
                    <img src="" alt="" class="w-100 city-img">
                 </div>
                </aside>
           </div>
        <div class="col-12 col-lg-8">
            <main class="bg-second mt-2 px-3">
              <div class="container">
                <div class="row pt-4 days g-2 weatherDays">
                </div>
                <div class="row mt-5 days pb-4">
                    <h2 class="h4 mb-4">Today's Highlights</h2>
                    <div class="col-lg-4">
                        <div class="shadow inner bg-white mb-2 py-5 px-3 text-center  custom-radius-left custom-radius-right">
                            <p class="text-secondary">Wind Status</p>
                            <h3 class="wind my-4"></h3>
                            <i class="fa-solid fa-wind me-2 fs-5 text-warning"></i>
                            <span class="windDir text-secondary"></span>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="shadow inner bg-white mb-2 py-5 px-3 text-center  custom-radius-left custom-radius-right">
                            <p class="text-secondary">Sunrise & Sunset</p>
                            <div class=" my-4 d-flex justify-content-center align-items-center">
                                <i class="fa-solid fa-sun fs-5 me-2 text-warning"></i>
                                <h3 class="sunrise h4 mb-0"></h3>
                            </div>
                            <div class="d-flex justify-content-center align-items-center">
                                <i class="fa-solid fa-moon fs-5 me-2 text-warning"></i>
                                <h3 class="sunset mb-0 h4"></h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="shadow inner bg-white mb-2 py-5 px-3 text-center  custom-radius-left custom-radius-right">
                            <p class="text-secondary">Humidity</p>
                            <h3 class="humidity my-4"></h3>
                            <span>Normal</span>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="shadow inner bg-white mb-2 py-5 px-3 text-center  custom-radius-left custom-radius-right">
                            <p class="text-secondary">UV Index</p>
                            <h3 class="uv my-4"></h3>
                            <i class="fa-solid fa-umbrella fs- mb-1 text-warning"></i>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="shadow inner bg-white mb-2 py-5 px-3 text-center  custom-radius-left custom-radius-right">
                            <p class="text-secondary">Visablity</p>
                            <h4 class="vis-km my-4"></h3>
                            <h4 class="vis-miles mb-0"></h3>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="shadow inner bg-white mb-2 py-5 px-3 text-center  custom-radius-left custom-radius-right">
                            <p class="text-secondary">min & max Tem</p>
                            <div class=" my-4 d-flex justify-content-center align-items-center">
                                <i class="fa-solid fa-circle-up fs-5 me-2 text-warning"></i>
                                <h3 class="max h4 mb-0"></h3>
                            </div>
                            <div class="d-flex justify-content-center align-items-center">
                                <i class="fa-solid fa-circle-down fs-5 me-2 text-warning"></i>
                                <h3 class="min mb-0 h4"></h3>
                            </div>
                        </div>
                    </div>
                </div>
              </div>
            </main>
        </div>
    </div>
  </div>
</section>



    <script src="./assets/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/index.js"></script>
</body>
</html>
